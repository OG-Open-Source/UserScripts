<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UserScripts</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #e4e4e4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161616;
          --fg: #ededed;
          --muted: #9a9a9a;
          --line: #2c2c2c;
        }
      }
      body {
        margin: 0 auto;
        max-width: 640px;
        padding: 2.5rem 1.25rem 4rem;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.55 system-ui,
          sans-serif;
      }
      a {
        color: inherit;
      }
      .lead,
      .note {
        color: var(--muted);
      }
      ul {
        padding: 0;
        list-style: none;
      }
      li {
        border-top: 1px solid var(--line);
      }
      li a {
        display: block;
        padding: 0.7rem 0;
        text-decoration: none;
      }
      li a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>UserScripts</h1>
    <p class="lead">Settings for the scripts distributed by OG-Open-Source/UserScripts.</p>
    <ul>
      <li><a href="./settings/language/">Language</a></li>
    </ul>
    <p class="note">
      Each setting lives on its own page, so a script's menu can open exactly the one it shows.
    </p>
  </body>
</html>
