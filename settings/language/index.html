<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="1" name="userscripts-manager">
    <title data-i18n="pageTitle">Language — UserScripts</title>
    <link href="../shared/tokens.css" rel="stylesheet">
    <link href="../shared/minimal.css" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="topbar">
        <nav>
          <a data-i18n="navHome" href="../../">← UserScripts</a>
        </nav>
        <span class="status-chip" data-i18n="detecting" id="statusChip"
          >Detecting…</span
        >
      </div>
      <h1 data-i18n="heading">Language</h1>
      <p data-i18n="lead">
        Applies to every installed script. The list is the languages those
        scripts actually ship.
      </p>
    </header>

    <main>
      <section>
        <div class="field">
          <label data-i18n="langLabel" for="langSelect">Language</label>
          <select id="langSelect"></select>
        </div>

        <div class="save-bar">
          <button
            class="btn btn-primary"
            data-i18n="apply"
            id="apply"
            type="button"
          >
            Apply
          </button>
        </div>

        <p class="note" id="note"></p>
      </section>
    </main>

    <script type="module">
      import {
        collectScripts,
        dispatchSettings,
        onPresence,
        waitForScripts,
      } from "../shared/bridge.js";
      import { createSettingsTranslator } from "../shared/i18n.js";

      const DICT = {
        "en-US": {
          pageTitle: "Language — UserScripts",
          navHome: "← UserScripts",
          detecting: "Detecting…",
          heading: "Language",
          lead: "Applies to every installed script. The list is the languages those scripts actually ship.",
          langLabel: "Language",
          apply: "Apply",
          emptyOptions: "No installed script announced a language",
          statusCount: "{count} script(s)",
          noScript: "No script detected",
          noteDetected:
            "Detected {count} installed script(s). Changes apply on each script's next page load.",
          noteNone:
            "Open this page through your userscript manager so installed scripts can be seen.",
          appliedCount: 'Applied "{lang}" to {count} installed script(s).',
          savedLocal:
            'Saved "{lang}" locally (no active script heard this page).',
        },
        "zh-Hant-TW": {
          pageTitle: "語言 — UserScripts",
          navHome: "← UserScripts",
          detecting: "偵測中…",
          heading: "語言",
          lead: "套用至所有已安裝腳本。清單內容為這些腳本實際提供的語言。",
          langLabel: "語言",
          apply: "套用",
          emptyOptions: "尚未有已安裝腳本宣告語言",
          statusCount: "{count} 個腳本",
          noScript: "未偵測到腳本",
          noteDetected:
            "已偵測到 {count} 個已安裝腳本。變更將於各腳本下次載入頁面時生效。",
          noteNone:
            "請透過已啟用使用者腳本管理器的瀏覽器開啟此頁，以便檢視已安裝腳本。",
          appliedCount: "已將「{lang}」套用至 {count} 個已安裝腳本。",
          savedLocal: "已在本機儲存「{lang}」（此頁面尚無作用中的腳本回應）。",
        },
        "zh-Hans-CN": {
          pageTitle: "语言 — UserScripts",
          navHome: "← UserScripts",
          detecting: "检测中…",
          heading: "语言",
          lead: "应用至所有已安装脚本。列表内容为这些脚本实际提供的语言。",
          langLabel: "语言",
          apply: "应用",
          emptyOptions: "尚无已安装脚本声明语言",
          statusCount: "{count} 个脚本",
          noScript: "未检测到脚本",
          noteDetected:
            "已检测到 {count} 个已安装脚本。更改将在各脚本下次加载页面时生效。",
          noteNone:
            "请通过已启用用户脚本管理器的浏览器打开此页，以便查看已安装脚本。",
          appliedCount: "已将“{lang}”应用至 {count} 个已安装脚本。",
          savedLocal: "已在本地保存“{lang}”（此页面尚无活动脚本响应）。",
        },
      };

      const i18n = createSettingsTranslator(DICT);
      i18n.applyDom();

      const KEY = "userscripts:lang";
      const SAVED_NOTICE_KEY = "userscripts:lang:saved-note";
      const languages = new Map();
      const loadedScriptIds = new Set();
      const chip = document.querySelector("#statusChip");
      const note = document.querySelector("#note");
      const langSelect = document.querySelector("#langSelect");
      let saved = localStorage.getItem(KEY) ?? "";
      let hasSavedNotice = false;

      try {
        const rawNotice = sessionStorage.getItem(SAVED_NOTICE_KEY);
        if (rawNotice) {
          sessionStorage.removeItem(SAVED_NOTICE_KEY);
          const parsed = JSON.parse(rawNotice);
          if (parsed?.lang) {
            hasSavedNotice = true;
            note.textContent = parsed.count
              ? i18n.t("appliedCount", {
                  lang: parsed.lang,
                  count: parsed.count,
                })
              : i18n.t("savedLocal", { lang: parsed.lang });
          }
        }
      } catch {
        // Ignore storage access errors in restricted browsing contexts.
      }

      function populateSelect(selectEl, options, desiredValue, emptyText = "") {
        selectEl.replaceChildren();
        if (options.length === 0) {
          if (emptyText) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = emptyText;
            selectEl.append(opt);
          }
          selectEl.disabled = true;
          return;
        }
        selectEl.disabled = false;
        for (const item of options) {
          const opt = document.createElement("option");
          opt.value = item.value;
          opt.textContent = item.label;
          selectEl.append(opt);
        }
        if (
          desiredValue &&
          options.some((item) => item.value === desiredValue)
        ) {
          selectEl.value = desiredValue;
        } else {
          selectEl.value = options[0].value;
        }
      }

      async function ingestScripts(list) {
        let addedLang = false;
        await Promise.all(
          list.map(async (script) => {
            if (loadedScriptIds.has(script.id)) {
              return;
            }
            loadedScriptIds.add(script.id);
            if (!script.localeUrl) {
              return;
            }
            try {
              const file = await fetch(script.localeUrl).then((res) =>
                res.json()
              );
              for (const language of file.languages ?? []) {
                if (!languages.has(language.code)) {
                  languages.set(language.code, language.name);
                  addedLang = true;
                }
              }
            } catch {
              // A script whose locale file is unreachable simply offers nothing.
            }
          })
        );
        return addedLang;
      }

      function renderOptions() {
        const entries = Array.from(languages, ([code, name]) => ({
          value: code,
          label: `${name} (${code})`,
        }));
        const desired =
          saved && languages.has(saved) ? saved : langSelect.value;
        populateSelect(langSelect, entries, desired, i18n.t("emptyOptions"));
      }

      function updateChip(list) {
        chip.textContent = list.length
          ? i18n.t("statusCount", { count: list.length })
          : i18n.t("noScript");
      }

      function updateStatus(list) {
        updateChip(list);
        if (!hasSavedNotice) {
          note.textContent = list.length
            ? i18n.t("noteDetected", { count: list.length })
            : i18n.t("noteNone");
        }
      }

      const scripts = await waitForScripts(1800);
      await ingestScripts(scripts);
      renderOptions();
      updateStatus(scripts);

      onPresence(async (list) => {
        const changed = await ingestScripts(list);
        if (changed) {
          renderOptions();
        }
        updateStatus(list);
      });

      document.querySelector("#apply").addEventListener("click", () => {
        const currentScripts = collectScripts();
        const { value } = langSelect;
        if (!value) {
          return;
        }
        localStorage.setItem(KEY, value);
        saved = value;
        dispatchSettings({ lang: value });
        try {
          sessionStorage.setItem(
            SAVED_NOTICE_KEY,
            JSON.stringify({ lang: value, count: currentScripts.length })
          );
        } catch {
          // Ignore storage access errors in restricted browsing contexts.
        }
        window.location.reload();
      });
    </script>
  </body>
</html>
